        .progress-bar-fill {

            transition: width 0.35s ease-out;
        }

        /* LIVE GPS TICKER */
        .gps-ticker {
            position: absolute;
            top: 20px;
            right: 25px;
            background: rgba(6, 10, 18, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.35);

            letter-spacing: 1px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .gps-ticker .status-dot {
            width: 9px;
            height: 9px;
            background-color: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f0ff;
            animation: blink 1.2s infinite alternate;

    <script>
        const map = L.map('map', { 
            zoomControl: false,
            preferCanvas: true,
            fadeAnimation: true,
            zoomAnimation: true,
            markerZoomAnimation: true
        }).setView([14.8, 46.0], 6);

        const darkLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri Dark Gray', 
            maxZoom: 16,
            keepBuffer: 6
        }).addTo(map);

        map.on('move', () => {
            const center = map.getCenter();
            document.getElementById('latVal').innerText = center.lat.toFixed(3);
            document.getElementById('lngVal').innerText = center.lng.toFixed(3);
        });

        function getCountryColor(name) {
            if (!name) return '#334155';
            const n = name.toLowerCase();
            if (n.includes('yemen')) return '#d90429';
            if (n.includes('saudi')) return '#10b981';
            if (n.includes('iran')) return '#7209b7';
            if (n.includes('israel')) return '#2563eb';
            if (n.includes('egypt')) return '#f59e0b';
            if (n.includes('emirates') || n.includes('uae')) return '#06b6d4';
            if (n.includes('oman')) return '#0d9488';
            if (n.includes('jordan')) return '#f97316';
            if (n.includes('iraq')) return '#ec4899';
            if (n.includes('syria')) return '#a855f7';
            if (n.includes('sudan')) return '#84cc16';
            if (n.includes('eritrea')) return '#e11d48';
            if (n.includes('ethiopia')) return '#b45309';
            if (n.includes('somalia') || n.includes('somaliland')) return '#0284c7';
            if (n.includes('djibouti')) return '#facc15';
            return '#475569';
        }

        function renderRisikoLayer(geojson) {
            L.geoJSON(geojson, {
                smoothFactor: 1.5,
                style: function(feature) {
                    const name = feature.properties.ADMIN || feature.properties.NAME || feature.properties.name || feature.properties.sovereignt || "";
                    return { 
                        fillColor: getCountryColor(name), 
                        weight: 2, 
                        color: '#ffffff',
                        opacity: 0.85, 
                        fillOpacity: 0.65
                    };
                },
                onEachFeature: function(feature, layer) {
                    const name = feature.properties.ADMIN || feature.properties.NAME || feature.properties.name || "";
                    const targetCountries = ['Yemen', 'Saudi Arabia', 'Iran', 'Israel', 'Egypt', 'United Arab Emirates', 'Oman', 'Sudan', 'Eritrea', 'Ethiopia', 'Somalia'];
                    if (targetCountries.some(tc => name.toLowerCase().includes(tc.toLowerCase()))) {
                        layer.bindTooltip(name.toUpperCase(), { 
                            permanent: true, 
                            direction: 'center', 
                            className: 'country-label' 
                        });
                    }
                }
            }).addTo(map);
        }

        fetch('https://rawcdn.githack.com/datasets/geo-countries/master/data/countries.geojson')
            .then(res => res.json())
            .then(data => renderRisikoLayer(data))
            .catch(() => {
                fetch('https://cdn.jsdelivr.net/gh/datasets/geo-countries@master/data/countries.geojson')
                    .then(res => res.json())
                    .then(data => renderRisikoLayer(data));
            });

        }

        function closeExhibitModal(e) {
            if (!e || e.target.id === 'exhibitModal' || e.target.tagName === 'BUTTON') {
                document.getElementById('exhibitModal').style.display = 'none';
            }
        }

        function openVideoModal(youtubeId, titleText) {

        }

        function closeVideoModal(e) {

        let currentSlide = 0;
        let activeMarkersLayer = L.layerGroup().addTo(map);
        let activeLinesLayer = L.layerGroup().addTo(map);

        function updateSlide(index) {
            const slide = slides[index];

            map.flyTo(slide.coords, slide.zoom, { 
                duration: 1.6, 
                easeLinearity: 0.25,
                noMoveStart: true 
            });

            document.getElementById('phaseTag').innerText = slide.phase;
            document.getElementById('slideTitle').innerText = slide.title;
            document.getElementById('slideSubtitle').innerText = slide.subtitle;
            document.getElementById('slideContent').innerHTML = slide.content;
            document.getElementById('slideCounter').innerText = `${index + 1 < 10 ? '0' : ''}${index + 1} / ${slides.length < 10 ? '0' : ''}${slides.length}`;
            
            // Hide PREV button on first slide
            const prevBtn = document.getElementById('prevBtn');
            if (index === 0) {
                prevBtn.style.visibility = 'hidden';
            } else {
                prevBtn.style.visibility = 'visible';
            }

            const videoBox = document.getElementById('videoBox');
            if (slide.video && slide.video.trim() !== "") {
                videoBox.style.display = 'block';
                videoBox.innerHTML = slide.video;
            } else {
                videoBox.style.display = 'none';
                videoBox.innerHTML = '';
            }

            // Always close CIA map viewer when switching slides
            closeCiaMap();

            const progressPercent = ((index + 1) / slides.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;

            activeMarkersLayer.clearLayers();
            activeLinesLayer.clearLayers();

            if (slide.lines) {
                slide.lines.forEach(l => {
                    const polyline = L.polyline(l.coords, {
                        className: l.colorClass,
                        weight: 3.5,
                        opacity: 0.95
                    });
                    activeLinesLayer.addLayer(polyline);
                });
            }

            slide.markers.forEach(m => {
                let icon;
                if (m.type === 'flame') {
                    icon = L.divIcon({ className: '', html: `<i class="fa-solid fa-fire flame-marker"></i>`, iconSize: [32, 32], iconAnchor: [16, 16] });
                } else if (m.type === 'flag') {
                    const fallback = m.fallbackImg ? `onerror="this.src='${m.fallbackImg}';"` : '';
                    icon = L.divIcon({ 
                        className: '', 
                        html: `<img src="${m.img}" class="flag-avatar" alt="Flag" ${fallback}>`, 
                        iconSize: [50, 32], 
                        iconAnchor: [25, 16] 
                    });
                } else {
                    icon = L.divIcon({ 
                        className: '', 
                        html: `<img src="${m.img}" class="leader-avatar" alt="Leader" onerror="this.outerHTML='<div class=\\'leader-avatar-fallback\\'><i class=\\'fa-solid fa-user-shield\\'></i></div>';">`, 
                        iconSize: [52, 52], 
                        iconAnchor: [26, 26] 
                    });
                }

                const marker = L.marker([m.lat, m.lng], { icon: icon });
                if (m.label) {
                    marker.bindTooltip(m.label, { permanent: true, direction: 'right', offset: [15, 0], className: 'city-label' });
                }
                activeMarkersLayer.addLayer(marker);
            });
        }

        function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; updateSlide(currentSlide); } }
        function prevSlide() { if (currentSlide > 0) { currentSlide--; updateSlide(currentSlide); } }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'Escape') {
                closeExhibitModal();
                closeVideoModal();
                closeCiaMap();
            }
        });

        updateSlide(0);
    </script>
